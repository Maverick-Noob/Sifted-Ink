[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sifted-ink"
version = "1.1.0"
description = "选墨集 / Sifted-Ink — 多 Agent 网文写作工作台（叙事手法 · 消耗预估 · 创作留痕）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Maverick-Noob" }]
keywords = ["novel", "writing", "ai", "chinese", "web-novel", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: Apache Software License",
    "Natural Language :: Chinese (Simplified)",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: Linguistic",
]

# Only the core is mandatory. The provider SDKs and the export formats are
# extras so that a plain install does not drag in 13 API clients.
dependencies = [
    "pyyaml>=6.0",
    "json5>=0.9",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
export = ["ebooklib>=0.18", "fpdf2>=2.7"]
providers-anthropic = ["anthropic>=0.30"]
providers-openai = ["openai>=1.30", "httpx>=0.27"]
providers-google = ["google-generativeai>=0.6"]
all-providers = [
    "anthropic>=0.30",
    "openai>=1.30",
    "httpx>=0.27",
    "google-generativeai>=0.6",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.9",
    "pip-audit>=2.6",
]

[project.scripts]
sifted-ink = "novel_preactor.novel_preactor:main"

[project.urls]
Homepage = "https://github.com/Maverick-Noob/Sifted-Ink"
Repository = "https://github.com/Maverick-Noob/Sifted-Ink"
Issues = "https://github.com/Maverick-Noob/Sifted-Ink/issues"

# The repository root IS the package directory, so the package name is mapped
# onto "." explicitly. Without this, `pip install .` cannot find the package.
[tool.setuptools]
package-dir = { "novel_preactor" = "." }
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["novel_preactor", "novel_preactor.*"]

[tool.setuptools.package-data]
novel_preactor = [
    "*.json",
    "TERMS.md",
    "webui/templates/*.html",
    "webui/static/*.css",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_configs = true
